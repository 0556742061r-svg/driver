<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>מונה - יומן נסיעות</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="המונה שלי">
<meta name="theme-color" content="#14161A">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2314161A'/%3E%3Ctext x='50' y='66' font-size='52' text-anchor='middle' fill='%23F4B400' font-family='Arial'%3E%E2%82%AA%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2314161A'/%3E%3Ctext x='50' y='66' font-size='52' text-anchor='middle' fill='%23F4B400' font-family='Arial'%3E%E2%82%AA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.2/confetti.browser.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#14161A;
    --surface:#1F2226;
    --surface2:#292D33;
    --text:#F2F1ED;
    --muted:#8B9099;
    --accent:#F4B400;
    --accent-dim:#4a3d10;
    --paid:#3FB27F;
    --paid-dim:#1c3327;
    --unpaid:#E85D4A;
    --unpaid-dim:#3a211c;
    --divider:#31353b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Heebo',sans-serif; overscroll-behavior-y:none;}
  .mono{font-family:'Roboto Mono',monospace;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:100px; position:relative;}

  header{padding:22px 20px 8px; display:flex; align-items:baseline; justify-content:space-between;}
  header h1{font-size:19px; font-weight:900; margin:0; letter-spacing:.5px;}
  header .date{font-size:12px; color:var(--muted); font-family:'Roboto Mono',monospace;}

  .meter{
    margin:10px 18px 6px; background:linear-gradient(180deg,var(--surface2),var(--surface));
    border-radius:18px; padding:20px 22px; position:relative; overflow:hidden;
    border:1px solid #35393f; box-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 10px 24px -12px rgba(0,0,0,.6);
  }
  .meter::before{content:"";position:absolute; inset:0; background:
    repeating-linear-gradient(90deg, rgba(244,180,0,.04) 0 2px, transparent 2px 14px);
    pointer-events:none;}
  .meter .label{font-size:11px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; font-weight:500;}
  .meter .amount{font-size:44px; font-weight:700; margin-top:4px; color:var(--accent); letter-spacing:1px; direction:ltr; text-align:right;}
  .meter .amount span{font-size:22px; opacity:.7; margin-right:4px;}
  .meter .sub{margin-top:10px; display:flex; gap:14px; font-size:12px; color:var(--muted);}

  .goalcard{
    margin:10px 18px 0; padding:16px 18px; background:var(--surface); border-radius:16px;
    border:1px solid #2f333a;
  }
  .goalcard.nogoal{text-align:center; padding:14px 18px; color:var(--muted); font-size:13px; cursor:pointer;}
  .goalcard.nogoal:active{background:var(--surface2);}
  .goalhead{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;}
  .goallabel{font-size:11.5px; color:var(--muted); letter-spacing:.5px;}
  .goalnums{font-family:'Roboto Mono',monospace; font-size:13px; color:var(--text); cursor:pointer;}
  .goalnums b{color:var(--accent); font-weight:700;}
  .goalbar{
    width:100%; height:14px; border-radius:10px; background:var(--surface2); overflow:hidden; position:relative;
  }
  .goalbarfill{
    height:100%; border-radius:10px; background:linear-gradient(90deg, #d99a00, var(--accent));
    transition:width .5s ease; min-width:0;
  }
  .goalbarfill.done{background:linear-gradient(90deg, var(--paid), #6fe3ab);}
  .goalmsg{margin-top:10px; font-size:12.5px; color:var(--muted); text-align:center;}
  .goalmsg.done{color:var(--paid); font-weight:600;}
  .goalinput{
    width:100%; padding:14px; border-radius:12px; background:var(--surface2); border:1px solid #3a3e44;
    color:var(--accent); font-family:'Roboto Mono',monospace; font-size:22px; font-weight:700; text-align:center;
    direction:ltr; margin-bottom:14px;
  }
  .meter .sub b{color:var(--text); font-family:'Roboto Mono',monospace;}

  .workdaybar{
    margin:10px 18px 0; padding:10px 14px; border-radius:12px; background:var(--surface);
    border:1px solid #2f333a; display:flex; align-items:center; justify-content:space-between;
    font-size:11.5px; color:var(--muted); flex-wrap:wrap; gap:8px;
  }
  .workdaybar.viewing{background:#26241a; border-color:#5a5026; color:#e8d894;}
  .wdbtn{
    border:none; background:var(--surface2); color:var(--text); font-size:11px; font-weight:600;
    padding:7px 10px; border-radius:9px; cursor:pointer; font-family:'Heebo',sans-serif;
  }
  .wdbtn.end{background:var(--unpaid-dim); color:var(--unpaid);}
  .wdbtn:active{opacity:.8;}
  .outstanding{
    margin:10px 18px; padding:13px 16px; border-radius:14px; background:var(--unpaid-dim);
    border:1px solid #5a2f26; display:flex; align-items:center; justify-content:space-between;
    font-size:13px; color:#f0b3a6;
  }
  .outstanding b{font-family:'Roboto Mono',monospace; font-size:17px; color:var(--unpaid); font-weight:700;}
  .outstanding.hidden{display:none;}

  .actions{display:flex; gap:8px; margin:16px 18px 8px; flex-wrap:wrap;}
  .actbtn{
    flex:1; min-width:96px; border:none; border-radius:16px; padding:16px 6px; font-family:'Heebo',sans-serif;
    font-weight:700; font-size:13.5px; color:var(--bg); cursor:pointer; display:flex; flex-direction:column;
    align-items:center; gap:5px; transition:transform .08s ease;
  }
  .actbtn:active{transform:scale(.96);}
  .actbtn .ic{font-size:22px;}
  .actbtn.passenger{background:var(--accent);}
  .actbtn.delivery{background:#e6e6e6;}
  .actbtn.install{background:#4FD1C5;}
  .expenserow{display:flex; gap:10px; margin:0 18px;}
  .fuelbtn{
    flex:1; padding:12px; border-radius:14px; border:1px dashed #45494f;
    background:transparent; color:var(--muted); font-family:'Heebo',sans-serif; font-weight:500;
    font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .fuelbtn:active{background:var(--surface);}

  .tabs{display:flex; gap:6px; margin:22px 18px 10px; background:var(--surface); padding:4px; border-radius:12px;}
  .tab{flex:1; text-align:center; padding:9px 4px; border-radius:9px; font-size:12.5px; font-weight:500; color:var(--muted); cursor:pointer;}
  .tab.active{background:var(--surface2); color:var(--text); font-weight:700;}

  .listwrap{margin:4px 18px 0;}
  .resetlink{
    text-align:center; margin:22px 18px 4px; font-size:12px; color:var(--muted); padding:10px;
    cursor:pointer; opacity:.7;
  }
  .resetlink:active{opacity:1; color:var(--unpaid);}

  .fab{
    position:fixed; bottom:26px; left:20px; width:60px; height:60px; border-radius:50%;
    background:var(--unpaid); color:#fff; font-size:25px; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; box-shadow:0 10px 24px -8px rgba(0,0,0,.7); z-index:40;
    touch-action:none; user-select:none; -webkit-touch-callout:none; -webkit-user-select:none;
  }
  .fab:active{transform:scale(.94);}
  .fab.recording{animation:fabpulse 1s infinite;}
  @keyframes fabpulse{
    0%{ box-shadow:0 0 0 0 rgba(232,93,74,.65); }
    70%{ box-shadow:0 0 0 20px rgba(232,93,74,0); }
    100%{ box-shadow:0 0 0 0 rgba(232,93,74,0); }
  }
  .rectoast{
    position:fixed; bottom:98px; left:14px; background:var(--surface2); color:var(--unpaid);
    font-family:'Roboto Mono',monospace; font-weight:700; font-size:13px; padding:8px 16px;
    border-radius:20px; display:none; align-items:center; z-index:41;
    box-shadow:0 6px 16px -4px rgba(0,0,0,.6); border:1px solid #5a2f26;
  }

  .voicewrap{margin:14px 18px 0;}
  .voiceheader{font-size:12px; color:var(--muted); margin-bottom:8px; font-weight:600;}
  .voicenote{
    display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--surface); border-radius:14px;
    margin-bottom:8px; border:1px solid #2f333a;
  }
  .voicenote audio{filter:invert(.88) hue-rotate(180deg);}
  .voicemeta{text-align:center; min-width:56px; flex-shrink:0;}
  .voicetag{font-size:10.5px; color:var(--text); font-weight:600; max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .voicetime{font-size:10px; color:var(--muted); font-family:'Roboto Mono',monospace;}

  .recbtn{
    width:96px; height:96px; border-radius:50%; border:none; background:var(--unpaid); color:#fff; font-size:36px;
    cursor:pointer; box-shadow:0 0 0 8px var(--unpaid-dim);
  }
  .recbtn.stop{background:var(--surface2); color:var(--unpaid); box-shadow:0 0 0 8px var(--surface2);}
  .rectimer{font-size:32px; color:var(--unpaid); margin-bottom:22px; font-weight:700;}
  .empty{text-align:center; padding:50px 20px; color:var(--muted); font-size:13px; line-height:1.8;}
  .empty .ic{font-size:34px; display:block; margin-bottom:10px;}

  .entry{
    display:flex; align-items:flex-start; gap:12px; padding:13px 14px; background:var(--surface);
    border-radius:14px; margin-bottom:8px; border:1px solid #292d33;
  }
  .entry .ic{
    width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:17px; flex-shrink:0; background:var(--surface2);
  }
  .entry .mid{flex:1; min-width:0;}
  .entry .ttl{font-size:13.5px; font-weight:500;}
  .entry .meta{
    font-size:11px; color:var(--muted); margin-top:3px; font-family:'Roboto Mono',monospace;
    display:flex; align-items:center; flex-wrap:wrap; row-gap:2px;
  }
  .entry .meta a{color:var(--accent); text-decoration:none; direction:ltr; unicode-bidi:isolate;}
  .contactline{
    margin-top:7px; padding-top:6px; border-top:1px solid #292d33; display:flex; align-items:center;
    flex-wrap:wrap; gap:10px; font-size:11px; color:var(--muted); font-family:'Roboto Mono',monospace;
  }
  .contactline a{color:var(--accent); text-decoration:none; direction:ltr; unicode-bidi:isolate;}
  .entry .amt{
    font-family:'Roboto Mono',monospace; font-weight:700; font-size:15px; direction:ltr;
    width:68px; text-align:right; flex-shrink:0; padding-top:1px; white-space:nowrap;
  }
  .entry .amt{cursor:pointer;}
  .entry .amt:active{color:var(--accent) !important;}
  .entry .del{color:var(--muted); font-size:15px; padding:2px; cursor:pointer;}
  .rowactions{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; flex-shrink:0; padding-top:1px; width:22px;}
  .badge{
    font-size:10px; font-weight:700; padding:4px 9px; border-radius:20px; cursor:pointer; white-space:nowrap;
    border:none; font-family:'Heebo',sans-serif; min-width:64px; text-align:center; flex-shrink:0;
  }
  .badge.paid{background:var(--paid-dim); color:var(--paid);}
  .badge.unpaid{background:var(--unpaid-dim); color:var(--unpaid);}

  /* Modal */
  .overlay{position:fixed; inset:0; background:rgba(10,11,13,.7); backdrop-filter:blur(2px); display:none; align-items:flex-end; z-index:50;}
  .overlay.open{display:flex;}
  .sheet{
    width:100%; max-width:480px; margin:0 auto; background:var(--surface); border-radius:24px 24px 0 0;
    padding:22px 20px 28px; animation:slideup .22s ease;
  }
  @keyframes slideup{from{transform:translateY(100%)} to{transform:translateY(0)}}
  .sheet h2{margin:0 0 16px; font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px;}
  .display{
    background:var(--bg); border-radius:14px; padding:18px; text-align:center; margin-bottom:14px;
    border:1px solid #2b2f35;
  }
  .display .val{font-family:'Roboto Mono',monospace; font-size:38px; font-weight:700; color:var(--accent); direction:ltr;}
  .commlabel{font-size:12px; color:var(--muted); margin-bottom:8px;}
  .commquick{display:flex; gap:8px; margin-bottom:16px;}
  .qchip{
    flex:1; padding:11px 4px; border-radius:12px; background:var(--surface2); text-align:center; font-size:12.5px;
    color:var(--muted); cursor:pointer; border:1px solid transparent; font-weight:500;
  }
  .qchip.on{border-color:var(--accent); color:var(--accent); background:var(--accent-dim); font-weight:700;}
  .comminput{
    flex:1; min-width:0; padding:11px 6px; border-radius:12px; background:var(--surface2); border:1px solid #3a3e44;
    color:var(--text); font-family:'Roboto Mono',monospace; font-size:13px; text-align:center;
  }
  .comminput::placeholder{color:var(--muted);}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px;}
  .key{
    padding:16px 0; border-radius:12px; background:var(--surface2); border:none; color:var(--text);
    font-size:19px; font-weight:500; font-family:'Roboto Mono',monospace; cursor:pointer;
  }
  .key:active{background:#363b42;}
  .key.fn{color:var(--muted); font-size:15px;}
  .saverow{display:flex; gap:8px;}
  .savebtn{
    flex:1; padding:15px 4px; border:none; border-radius:14px; font-weight:700; font-size:12.5px; cursor:pointer;
    color:#0c0d0f; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; text-align:center;
  }
  .savebtn.paid{background:var(--paid);}
  .savebtn.unpaid{background:var(--unpaid); color:#1c0d09;}
  .savebtn.cancelbtn{background:var(--surface2); color:var(--muted); border:1px solid #45494f;}
  .savebtn.single{background:var(--accent); flex:1;}
  .alertbar{
    margin:10px 18px; padding:13px 16px; border-radius:14px; display:flex; align-items:center; justify-content:space-between;
    font-size:13px;
  }
  .alertbar.hidden{display:none;}
  .alertbar.charge{background:#2f2a18; border:1px solid #5a4d26; color:#e8cf94;}
  .alertbar.charge b{font-family:'Roboto Mono',monospace; font-size:16px; color:var(--accent); font-weight:700;}
  .chargebadge{font-size:10px; font-weight:700; padding:4px 9px; border-radius:20px; cursor:pointer; white-space:nowrap; border:none; font-family:'Heebo',sans-serif; min-width:64px; text-align:center; flex-shrink:0;}
  .chargebadge.pending{background:var(--surface2); color:var(--muted);}
  .chargebadge.charged{background:var(--unpaid-dim); color:var(--unpaid);}
  .chargebadge.cleared{background:var(--paid-dim); color:var(--paid);}
  .cancelledtag{font-size:10px; font-weight:600; color:var(--muted); padding:4px 9px; border-radius:20px; background:var(--surface2); min-width:64px; text-align:center; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center;}

  .taskswrap{margin:14px 18px 0;}
  .task{
    display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:14px; margin-bottom:8px;
    border:1px solid #35393f;
  }
  .task.ok{background:var(--surface);}
  .task.soon{background:#332a14; border-color:#6b551f;}
  .task.overdue{background:var(--unpaid-dim); border-color:#7a3a2c;}
  .taskmid{flex:1; min-width:0;}
  .taskttl{font-size:13.5px; font-weight:600;}
  .tasktime{font-size:11px; color:var(--muted); margin-top:2px; font-family:'Roboto Mono',monospace;}
  .task.soon .tasktime{color:#e8cf94;}
  .task.overdue .tasktime{color:var(--unpaid); font-weight:700;}
  .taskdone{
    width:34px; height:34px; border-radius:10px; border:none; background:var(--paid); color:#0c0d0f;
    font-weight:700; font-size:15px; cursor:pointer; flex-shrink:0;
  }
  .taskdel{color:var(--muted); font-size:15px; padding:4px 6px; cursor:pointer;}
  .taskbtn{
    width:calc(100% - 36px); margin:12px 18px 0; padding:12px; border-radius:14px; border:1px dashed var(--accent);
    background:transparent; color:var(--accent); font-family:'Heebo',sans-serif; font-weight:600;
    font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .taskbtn:active{background:var(--accent-dim);}
  .taskinput{
    width:100%; padding:14px; border-radius:12px; background:var(--surface2); border:1px solid #3a3e44;
    color:var(--text); font-family:'Heebo',sans-serif; font-size:14px; margin-bottom:10px; direction:rtl;
  }
  .taskinput[type=time]{direction:ltr; text-align:center; font-family:'Roboto Mono',monospace;}

  .contacttoggle{
    text-align:center; padding:10px; margin-bottom:12px; border-radius:12px; border:1px dashed #45494f;
    color:var(--muted); font-size:12.5px; cursor:pointer; font-weight:500;
  }
  .contactfields{display:flex; gap:8px; margin-bottom:14px;}
  .contactinput{
    flex:1; padding:12px; border-radius:12px; background:var(--surface2); border:1px solid #3a3e44;
    color:var(--text); font-family:'Heebo',sans-serif; font-size:13px; direction:rtl;
  }
  .contactinput[type=tel]{direction:ltr; text-align:center; font-family:'Roboto Mono',monospace;}
  .entrycontact{display:flex; align-items:center; gap:10px; margin-top:4px; font-size:11.5px; color:var(--muted);}
  .deadlinerow{display:flex; gap:10px; margin-bottom:6px; align-items:stretch;}
  .timepicker{
    flex:1; padding:16px 14px; border-radius:14px; background:var(--surface2); border:1.5px solid var(--accent);
    color:var(--accent); font-family:'Roboto Mono',monospace; font-size:24px; font-weight:700; direction:ltr;
    text-align:center; letter-spacing:1px;
  }
  .timepicker::-webkit-calendar-picker-indicator{filter:invert(.8) sepia(1) saturate(4) hue-rotate(5deg); opacity:.85; transform:scale(1.3); cursor:pointer;}
  .timeresetbtn{
    flex:0 0 56px; border-radius:14px; background:var(--surface2); border:1px solid #3a3e44; color:var(--muted);
    font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .timeresetbtn:active{background:#363b42; color:var(--text);}
  .entrycontact .cname{color:var(--text); font-weight:500;}
  .editdebtor{color:var(--muted); cursor:pointer; padding:2px;}
  .editdebtor:active{color:var(--accent);}
  .cancel{
    width:100%; text-align:center; margin-top:14px; color:var(--muted); font-size:15px; font-weight:600;
    padding:14px; cursor:pointer; border-radius:12px; background:var(--surface2);
  }
  .cancel:active{background:#363b42; color:var(--text);}

  .loginwrap{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:24px;}
  .loginlogo{text-align:center; margin-bottom:34px;}
  .loginlogo .em{font-size:44px;}
  .loginlogo h1{font-size:22px; font-weight:900; margin:10px 0 4px;}
  .loginlogo p{font-size:13px; color:var(--muted); margin:0;}
  .logincard{background:var(--surface); border:1px solid #2f333a; border-radius:20px; padding:22px;}
  .googlebtn{
    width:100%; padding:15px; border-radius:14px; background:#fff; color:#1f1f1f; border:none;
    font-family:'Heebo',sans-serif; font-weight:700; font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:18px;
  }
  .googlebtn:active{background:#eee;}
  .divider{display:flex; align-items:center; gap:10px; margin:4px 0 18px; color:var(--muted); font-size:12px;}
  .divider::before, .divider::after{content:""; flex:1; height:1px; background:#31353b;}
  .authinput{
    width:100%; padding:14px; border-radius:12px; background:var(--surface2); border:1px solid #3a3e44;
    color:var(--text); font-family:'Heebo',sans-serif; font-size:14px; margin-bottom:10px; direction:ltr;
    text-align:right;
  }
  .authsubmit{
    width:100%; padding:15px; border-radius:14px; background:var(--accent); color:var(--bg); border:none;
    font-family:'Heebo',sans-serif; font-weight:700; font-size:14px; cursor:pointer; margin-top:4px;
  }
  .authsubmit:active{opacity:.9;}
  .authtoggle{text-align:center; margin-top:16px; font-size:13px; color:var(--muted);}
  .authtoggle b{color:var(--accent); cursor:pointer; font-weight:700;}
  .autherr{

<script>
const STORAGE_KEY = 'entries_v1';
const TASKS_KEY = 'tasks_v1';

const EXTRA_INCOME_KEY = 'extraincome_v1';
const BANK_TRANSACTIONS_KEY = 'banktx_v1'; // written externally by the optional bank-sync GitHub Action, read-only here
const MERCHANT_ALIASES_KEY = 'merchant_aliases_v1'; // maps raw bank description -> friendly name you choose, remembered forever
const BANK_TX_TAGS_KEY = 'banktxtags_v1'; // maps raw bank description -> {type:'recurring'|'onetime'}, remembered forever
const BANK_TX_APPROVALS_KEY = 'banktxapprovals_v1'; // maps a stable transaction signature -> true once you've reviewed & approved it
const WORKDAYS_PATTERN_KEY = 'workdayspattern_v1';

let entries = [];
let tasks = [];
let voiceNotes = [];
let workdayStart = null;
let workdayHistory = [];

let dailyGoal = null;
let goalConfettiShownFor = null;

let debts = [];
let debtPayments = [];
let recurringCharges = [];
let extraIncomes = [];
let bankTransactions = [];
let merchantAliases = {};
let bankTxTags = {};
let bankTxApprovals = {};
let currentScreen = 'main'; // 'main' | 'debts' | 'ai' | 'banksetup'
let debtEditTargetId = null;
let workDaysPattern = [true,true,true,true,true,true,false]; // index 0=Sunday .. 6=Saturday, Friday default on
let workExceptions = []; // [{date:'YYYY-MM-DD', working:false}] overrides the weekly pattern for a specific date
let debtRemindersChecked = false;
let period = 'today';
let draft = null; // {kind:'passenger'|'delivery'|'install'|'fuel', digits:'', commissionPct:number}
let editTargetId = null; // set when adding debtor info to an already-saved entry
let lastCommissionPct = { passenger:0, delivery:12, install:0 };

const OWNER_EMAIL = '0556742061r@gmail.com';
function isOwnerAccount(){
  return currentUserEmail && currentUserEmail.toLowerCase() === OWNER_EMAIL.toLowerCase();
}

const CATS = {
  passenger:{label:'נסיעה', ic:'🚕'},
  delivery:{label:'משלוח', ic:'📦'},
  install:{label:'התקנה', ic:'🔧'},
  fuel:{label:'דלק', ic:'⛽'},
  food:{label:'אוכל', ic:'🍔'}
};
const EXPENSE_KINDS = ['fuel','food'];
function isExpenseKind(k){ return EXPENSE_KINDS.includes(k); }

function fmt(n){
  return '₪' + n.toLocaleString('he-IL', {minimumFractionDigits: n % 1 === 0 ? 0 : 2, maximumFractionDigits:2});
}

function netOf(e){
  if(isExpenseKind(e.kind)) return -e.amount;
  if(e.status==='cancelled'){
    if(e.commissionPct>0 && e.chargeStatus==='charged') return -(e.amount * (e.commissionPct/100));
    return 0;
  }
  const gross = e.amount;
  return gross * (1 - (e.commissionPct||0)/100);
}

function startOfPeriod(p){
  const d = new Date();
  d.setHours(0,0,0,0);
  if(p==='week'){ const day = d.getDay(); d.setDate(d.getDate()-day); return d; }
  if(p==='month'){ d.setDate(1); return d; }
  return new Date(0);
}

function filtered(){
  if(period==='today'){
    let start, end;
    if(viewingWorkdayId){
      const wd = workdayHistory.find(w=>w.id===viewingWorkdayId);
      start = wd ? wd.start : workdayStart;
      end = wd ? wd.end : Infinity;
    } else {
      start = workdayStart;
      end = Infinity;
    }
    return entries.filter(e => e.ts >= start && e.ts < end).sort((a,b)=>b.ts-a.ts);
  }
  const start = startOfPeriod(period).getTime();
  return entries.filter(e => e.ts >= start).sort((a,b)=>b.ts-a.ts);
}

function currentTs(){
  // If we're viewing (and adding to) a past workday, place new entries inside that day's range
  if(viewingWorkdayId){
    const wd = workdayHistory.find(w=>w.id===viewingWorkdayId);
    if(wd){
      const count = entries.filter(e=>e.ts>=wd.start && e.ts<wd.end).length;
      let t = wd.start + count*1000;
      if(t >= wd.end) t = wd.end - 1000;
      return t;
    }
  }
  return Date.now();
}

function endWorkday(){
  const ok = confirm('לסיים את יום העבודה הנוכחי? כל מה שתזין מעכשיו ייספר כיום עבודה חדש.');
  if(!ok) return;
  const now = Date.now();
  workdayHistory.push({ id:'wd'+now+Math.random().toString(36).slice(2,6), start: workdayStart, end: now });
  saveWorkdayHistory();
  workdayStart = now;
  saveWorkdayStart();
  viewingWorkdayId = null;
  render();
}
function openWorkdayStartEdit(){
  document.getElementById('overlay').classList.add('open');
  const sheet = document.getElementById('sheet');
  const d = new Date(workdayStart);
  const pad = n=>String(n).padStart(2,'0');
  const dtVal = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const lastClosed = [...workdayHistory].sort((a,b)=>b.end-a.end)[0];
  sheet.innerHTML = `
    <h2>✏️ תיקון שעת תחילת יום העבודה</h2>
    <div style="font-size:12px; color:var(--muted); text-align:center; margin-bottom:12px;">
      אם היום "התאפס" לבד באמצע (למשל בגלל תקלה), אפשר לתקן כאן ידנית מתי באמת התחיל יום העבודה.
    </div>
    <input id="workdayStartInput" class="goalinput" style="font-size:16px;" type="datetime-local" value="${dtVal}">
    <div class="saverow" style="margin-top:14px;">
      <button class="savebtn single" onclick="submitWorkdayStartEdit()">💾 שמירה</button>
    </div>
    ${lastClosed ? `<div class="contacttoggle" onclick="mergeLastClosedWorkday('${lastClosed.id}')">🔗 מיזוג עם היום הקודם שנסגר (${new Date(lastClosed.start).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}–${new Date(lastClosed.end).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})})</div>` : ''}
    <div class="cancel" onclick="closeSheet()">ביטול</div>
  `;
}
function submitWorkdayStartEdit(){
  const val = document.getElementById('workdayStartInput').value;
  if(!val) return;
  const ts = new Date(val).getTime();
  if(isNaN(ts)) return;
  workdayStart = ts;
  saveWorkdayStart();
  closeSheet();
  render();
}
function mergeLastClosedWorkday(id){
  const wd = workdayHistory.find(w=>w.id===id);
  if(!wd) return;
  if(!confirm('זה ימחק את הפיצול ויאחד את הימים חזרה יחד. להמשיך?')) return;
  workdayHistory = workdayHistory.filter(w=>w.id!==id);
  workdayStart = wd.start;
  saveWorkdayHistory();
  saveWorkdayStart();
  viewingWorkdayId = null;
  closeSheet();
  render();
}
function viewWorkday(id){
  viewingWorkdayId = id;
  period = 'today';
  render();
}
function exitWorkdayView(){
  viewingWorkdayId = null;
  render();
}
function openWorkdayHistory(){
  draft = null; editTargetId = null;
  document.getElementById('overlay').classList.add('open');
  const sheet = document.getElementById('sheet');
  const sorted = [...workdayHistory].sort((a,b)=>b.start-a.start);
  sheet.innerHTML = `
    <h2>📅 ימי עבודה קודמים</h2>
    ${sorted.length===0 ? `<div style="color:var(--muted); font-size:13px; padding:10px 0 20px;">עדיין לא סיימת אף יום עבודה. לוחצים "🌙 סיום יום עבודה" בעמוד הראשי כשמסיימים לנהוג.</div>` : sorted.map(wd=>{
      const s = new Date(wd.start), e = new Date(wd.end);
      const dateStr = s.toLocaleDateString('he-IL',{weekday:'short', day:'2-digit', month:'2-digit'});
      const rangeStr = s.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}) + ' – ' + e.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
      const count = entries.filter(x=>x.ts>=wd.start && x.ts<wd.end).length;
      return `
        <div class="task ok" style="cursor:pointer;" onclick="viewWorkday('${wd.id}'); closeSheet();">
          <div class="taskmid">
            <div class="taskttl">${dateStr}</div>
            <div class="tasktime">${rangeStr} · ${count} רשומות</div>
          </div>
        </div>`;
    }).join('')}
    <div class="cancel" onclick="closeSheet()">סגירה</div>
  `;
}

async function storageGet(key){
  // Always reads from this device's local storage (used for reading pre-cloud data & migration)
  try{
    if(hasClaudeStorage){
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : [];
    } else {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : [];
    }
  }catch(e){ return []; }
}

  try{
    if(currentUid && db){
      const json = JSON.stringify(value);
      if(json.length > 900000){
        alert('יש יותר מדי נתונים לשמור בבת אחת (בדרך כלל בגלל הקלטות קול כבדות) - מחק כמה הקלטות ישנות שכבר טופלו ונסה שוב.');
        return;
      }
      await db.collection('users').doc(currentUid).collection('data').doc(key).set({ value: json, updatedAt: Date.now() });
    } else if(hasClaudeStorage){
      await window.storage.set(key, JSON.stringify(value), false);
    } else {
      localStorage.setItem(key, JSON.stringify(value));
    }
  }catch(e){ console.error('storageSet failed', e); }
}

function fbDocRef(key){ return db.collection('users').doc(currentUid).collection('data').doc(key); }

function detachFirestoreListeners(){
  fbUnsubscribers.forEach(u=>{ try{ u(); }catch(e){} });
  fbUnsubscribers = [];
}

async function attachFirestoreListeners(){
  detachFirestoreListeners();

  // Resolve entries + workday start together first, synchronously, to avoid a race
  // where the workday listener fires before entries have loaded and wrongly resets the clock.
  try{
    const [entriesDoc, workdayDoc] = await Promise.all([
      fbDocRef(STORAGE_KEY).get(),
      fbDocRef(WORKDAY_KEY).get()
    ]);
    const ed = entriesDoc.data();
    entries = (ed && ed.value) ? JSON.parse(ed.value) : [];
    const wd = workdayDoc.data();
    const wsArr = (wd && wd.value) ? JSON.parse(wd.value) : [];
    if(wsArr && wsArr.length){
      workdayStart = wsArr[0];
    } else {
      workdayStart = entries.length ? 0 : Date.now();
      saveWorkdayStart();
    }
    render();
  }catch(e){ console.error('initial sync failed', e); }

  fbUnsubscribers.push(fbDocRef(STORAGE_KEY).onSnapshot(doc=>{
    const d = doc.data();
    entries = (d && d.value) ? JSON.parse(d.value) : [];
    render();
  }, err=>console.error(err)));
  fbUnsubscribers.push(fbDocRef(TASKS_KEY).onSnapshot(doc=>{
    const d = doc.data();
    tasks = (d && d.value) ? JSON.parse(d.value) : [];
    render();
  }, err=>console.error(err)));
  fbUnsubscribers.push(fbDocRef(VOICE_KEY).onSnapshot(doc=>{
    const d = doc.data();
    voiceNotes = (d && d.value) ? JSON.parse(d.value) : [];
    render();
  }, err=>console.error(err)));
  fbUnsubscribers.push(fbDocRef(WORKDAY_KEY).onSnapshot(doc=>{
    const d = doc.data();
    const arr = (d && d.value) ? JSON.parse(d.value) : [];
    if(arr && arr.length){
      workdayStart = arr[0];
      render();
    }
  }, err=>console.error(err)));
  fbUnsubscribers.push(fbDocRef(WORKDAY_HISTORY_KEY).onSnapshot(doc=>{
    const d = doc.data();
    workdayHistory = (d && d.value) ? JSON.parse(d.value) : [];
    render();
  }, err=>console.error(err)));
  fbUnsubscribers.push(fbDocRef(GOAL_KEY).onSnapshot(doc=>{
    const d = doc.data();
    const arr = (d && d.value) ? JSON.parse(d.value) : [];
    dailyGoal = (arr && arr.length) ? arr[0] : null;
    render();
  }, err=>console.error(err)));
  fbUnsubscribers.push(fbDocRef(DEBTS_KEY).onSnapshot(doc=>{
    const d = doc.data();
    debts = (d && d.value) ? JSON.parse(d.value) : [];
    render();
    checkMonthlyDebtReminders();
  }, err=>console.error(err)));
  fbUnsubscribers.push(fbDocRef(DEBT_PAYMENTS_KEY).onSnapshot(doc=>{
    const d = doc.data();
    debtPayments = (d && d.value) ? JSON.parse(d.value) : [];
    render();
  }, err=>console.error(err)));
  fbUnsubscribers.push(fbDocRef(RECURRING_KEY).onSnapshot(doc=>{
    const d = doc.data();
    recurringCharges = (d && d.value) ? JSON.parse(d.value) : [];
    render();
    checkMonthlyRecurringReminders();
  }, err=>console.error(err)));
  fbUnsubscribers.push(fbDocRef(EXTRA_INCOME_KEY).onSnapshot(doc=>{
    const d = doc.data();
    extraIncomes = (d && d.value) ? JSON.parse(d.value) : [];
    render();
  }, err=>console.error(err)));
  fbUnsubscribers.push(fbDocRef(BANK_TRANSACTIONS_KEY).onSnapshot(doc=>{
    const d = doc.data();
    bankTransactions = (d && d.value) ? JSON.parse(d.value) : [];
    render();
    checkBankRecurringPriceIncreases();
  }, err=>console.error(err)));
  fbUnsubscribers.push(fbDocRef(MERCHANT_ALIASES_KEY).onSnapshot(doc=>{
    const d = doc.data();
    merchantAliases = (d && d.value) ? JSON.parse(d.value) : {};
    render();
  }, err=>console.error(err)));
  fbUnsubscribers.push(fbDocRef(BANK_TX_TAGS_KEY).onSnapshot(doc=>{
    const d = doc.data();
    bankTxTags = (d && d.value) ? JSON.parse(d.value) : {};
    render();
    checkBankRecurringPriceIncreases();
  }, err=>console.error(err)));
  fbUnsubscribers.push(fbDocRef(BANK_TX_APPROVALS_KEY).onSnapshot(doc=>{
    const d = doc.data();
    bankTxApprovals = (d && d.value) ? JSON.parse(d.value) : {};
    render();
  }, err=>console.error(err)));
  fbUnsubscribers.push(fbDocRef(WORKDAYS_PATTERN_KEY).onSnapshot(doc=>{
    const d = doc.data();
    const arr = (d && d.value) ? JSON.parse(d.value) : [];
    if(arr && arr.length===7) workDaysPattern = arr;
    render();
  }, err=>console.error(err)));
  fbUnsubscribers.push(fbDocRef(WORK_EXCEPTIONS_KEY).onSnapshot(doc=>{
    const d = doc.data();
    workExceptions = (d && d.value) ? JSON.parse(d.value) : [];
    render();
  }, err=>console.error(err)));
}

async function checkAndOfferLocalImport(){
  try{
    const cloudDoc = await fbDocRef(STORAGE_KEY).get();
    const hasCloudData = cloudDoc.exists && cloudDoc.data().value && JSON.parse(cloudDoc.data().value).length > 0;
    if(hasCloudData) return;
    const localEntries = await storageGet(STORAGE_KEY);
    if(localEntries && localEntries.length > 0){
      const ok = confirm(`נמצאו ${localEntries.length} רשומות שמורות במכשיר הזה (מלפני ההתחברות). לייבא אותן לחשבון שלך?`);
      if(!ok) return;
      const [localTasks, localVoice, localWD, localWH, localDebts, localDebtPayments, localRecurring, localExtraIncome] = await Promise.all([
        storageGet(TASKS_KEY), storageGet(VOICE_KEY), storageGet(WORKDAY_KEY), storageGet(WORKDAY_HISTORY_KEY),
        storageGet(DEBTS_KEY), storageGet(DEBT_PAYMENTS_KEY), storageGet(RECURRING_KEY), storageGet(EXTRA_INCOME_KEY)
      ]);
      await storageSet(STORAGE_KEY, localEntries);
      if(localTasks && localTasks.length) await storageSet(TASKS_KEY, localTasks);
      if(localVoice && localVoice.length) await storageSet(VOICE_KEY, localVoice);
      if(localWD && localWD.length) await storageSet(WORKDAY_KEY, localWD);
      if(localWH && localWH.length) await storageSet(WORKDAY_HISTORY_KEY, localWH);
      if(localDebts && localDebts.length) await storageSet(DEBTS_KEY, localDebts);
      if(localDebtPayments && localDebtPayments.length) await storageSet(DEBT_PAYMENTS_KEY, localDebtPayments);
      if(localRecurring && localRecurring.length) await storageSet(RECURRING_KEY, localRecurring);
      if(localExtraIncome && localExtraIncome.length) await storageSet(EXTRA_INCOME_KEY, localExtraIncome);
      alert('הנתונים יובאו בהצלחה! ✅');
    }
  }catch(e){ console.error('import check failed', e); }
}

async function load(){
  // Local-only fallback mode (used only if Firebase failed to initialize)
  entries = await storageGet(STORAGE_KEY);
  tasks = await storageGet(TASKS_KEY);
  voiceNotes = await storageGet(VOICE_KEY);
  const wsArr = await storageGet(WORKDAY_KEY);
  workdayStart = (wsArr && wsArr.length) ? wsArr[0] : null;
  if(workdayStart === null){
    workdayStart = entries.length ? 0 : Date.now();
    saveWorkdayStart();
  }
  workdayHistory = await storageGet(WORKDAY_HISTORY_KEY);
  const goalArr = await storageGet(GOAL_KEY);
  dailyGoal = (goalArr && goalArr.length) ? goalArr[0] : null;
  debts = await storageGet(DEBTS_KEY);
  debtPayments = await storageGet(DEBT_PAYMENTS_KEY);
  recurringCharges = await storageGet(RECURRING_KEY);
  extraIncomes = await storageGet(EXTRA_INCOME_KEY);
  merchantAliases = (await storageGet(MERCHANT_ALIASES_KEY)) || {};
  bankTxTags = (await storageGet(BANK_TX_TAGS_KEY)) || {};
  bankTxApprovals = (await storageGet(BANK_TX_APPROVALS_KEY)) || {};
  const wdpArr = await storageGet(WORKDAYS_PATTERN_KEY);
  if(wdpArr && wdpArr.length===7) workDaysPattern = wdpArr;
  workExceptions = await storageGet(WORK_EXCEPTIONS_KEY);
  render();
  checkMonthlyDebtReminders();
  checkMonthlyRecurringReminders();
  checkBankRecurringPriceIncreases();
}
function save(){ storageSet(STORAGE_KEY, entries); }
function saveTasks(){ storageSet(TASKS_KEY, tasks); }
function saveVoiceNotes(){ storageSet(VOICE_KEY, voiceNotes); }
function saveWorkdayStart(){ storageSet(WORKDAY_KEY, [workdayStart]); }
function saveWorkdayHistory(){ storageSet(WORKDAY_HISTORY_KEY, workdayHistory); }
function saveDailyGoal(){ storageSet(GOAL_KEY, dailyGoal===null ? [] : [dailyGoal]); }
function saveDebts(){ storageSet(DEBTS_KEY, debts); }
function saveDebtPayments(){ storageSet(DEBT_PAYMENTS_KEY, debtPayments); }
function saveRecurring(){ storageSet(RECURRING_KEY, recurringCharges); }
function saveExtraIncomes(){ storageSet(EXTRA_INCOME_KEY, extraIncomes); }
function saveMerchantAliases(){ storageSet(MERCHANT_ALIASES_KEY, merchantAliases); }
function saveBankTxTags(){ storageSet(BANK_TX_TAGS_KEY, bankTxTags); }
function saveBankTxApprovals(){ storageSet(BANK_TX_APPROVALS_KEY, bankTxApprovals); }
function saveWorkDaysPattern(){ storageSet(WORKDAYS_PATTERN_KEY, workDaysPattern); }
function saveWorkExceptions(){ storageSet(WORK_EXCEPTIONS_KEY, workExceptions); }

function translateAuthError(code){
  const map = {
    'auth/invalid-email':'כתובת אימייל לא תקינה.',
    'auth/user-not-found':'לא נמצא חשבון עם המייל הזה.',

    'auth/email-already-in-use':'כבר יש חשבון עם המייל הזה - נסה להתחבר במקום להירשם.',
    'auth/weak-password':'הסיסמה חייבת להכיל לפחות 6 תווים.',
    'auth/invalid-credential':'פרטי ההתחברות שגויים.',
    'auth/popup-closed-by-user':'ההתחברות בוטלה.',
    'auth/network-request-failed':'בעיית רשת - בדוק את החיבור לאינטרנט.'
  };
  return map[code] || ('שגיאה: ' + code);
}

function submitEmailAuth(){
  if(!firebaseReady){ alert('החיבור לשרת לא זמין כרגע.'); return; }

  if(!(navigator.contacts && navigator.contacts.select)){
    alert('הדפדפן הזה לא תומך בייבוא אנשי קשר. אפשר להזין ידנית, או לוודא שאתה נכנס דרך כתובת https ולא קובץ מקומי.');
    return;
  }
  try{
    const picked = await navigator.contacts.select(['name','tel'], { multiple:false });
    if(picked && picked.length){
      const c = picked[0];
      const nameEl = document.getElementById(nameFieldId);
      const phoneEl = document.getElementById(phoneFieldId);
      if(nameEl && c.name && c.name[0]) nameEl.value = c.name[0];
      if(phoneEl && c.tel && c.tel[0]) phoneEl.value = c.tel[0];
      if(draft){ draft.name = nameEl ? nameEl.value : draft.name; draft.phone = phoneEl ? phoneEl.value : draft.phone; }
    }
  }catch(err){ /* user cancelled the picker */ }

// ---- Voice memo recorder ----
let mediaRecorder = null;
let recordedChunks = [];
let recordingTimerHandle = null;
let recordingSeconds = 0;
let previewBlob = null;

// Press-and-hold quick recording (primary flow): hold the FAB to record, release to auto-save.
let fabRecording = false;
let fabStartTime = 0;

function fabStart(e){
  if(e && e.preventDefault) e.preventDefault();
  if(fabRecording) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert('הדפדפן הזה לא תומך בהקלטת קול, או שהאתר לא נטען דרך חיבור מאובטח (https). נסה לפתוח את הקישור ישירות ב-Chrome או Safari הרגילים, לא מתוך אפליקציה אחרת (וואטסאפ וכו׳).');
    return;
  }
  try{
    navigator.mediaDevices.getUserMedia({ audio:true }).then(stream=>{
      fabRecording = true;
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = ev=>{ if(ev.data && ev.data.size>0) recordedChunks.push(ev.data); };
      mediaRecorder.onstop = ()=>{
        stream.getTracks().forEach(t=>t.stop());
        clearInterval(recordingTimerHandle);
        const toast = document.getElementById('recToast');
        const fabEl = document.getElementById('fabRec');
        if(toast) toast.style.display = 'none';
        if(fabEl) fabEl.classList.remove('recording');
        const elapsed = Math.max(1, Math.round((Date.now() - fabStartTime) / 1000));
        fabRecording = false;
        if(elapsed < 1 || recordedChunks.length === 0) return; // too short / accidental touch — discard silently
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        const reader = new FileReader();
        reader.onload = function(){
          voiceNotes.push({
            id: 'v'+Date.now()+Math.random().toString(36).slice(2,7),
            ts: Date.now(),
            durationSec: elapsed,
            tag: '',
            mime: blob.type,
            base64: reader.result,
            reviewed:false
          });
          saveVoiceNotes();
          render();
        };
        reader.readAsDataURL(blob);
      };
      mediaRecorder.start();
      fabStartTime = Date.now();
      const fabEl = document.getElementById('fabRec');
      const toast = document.getElementById('recToast');
      if(fabEl) fabEl.classList.add('recording');
      if(toast){ toast.style.display = 'flex'; toast.textContent = '🔴 00:00'; }
      recordingTimerHandle = setInterval(()=>{
        const sec = Math.round((Date.now() - fabStartTime) / 1000);
        if(toast) toast.textContent = '🔴 ' + durFmt(sec);
      }, 300);
    }).catch(err=>{
      alert('לא הצלחתי לגשת למיקרופון. סיבה: ' + (err && err.message ? err.message : err) + '\n\nייתכן שההרשאה נדחתה, או שהמיקרופון תפוס באפליקציה אחרת.');
    });
  }catch(err){
    alert('שגיאה בפתיחת ההקלטה: ' + (err && err.message ? err.message : err));
  }
}
function fabStop(){
  if(!fabRecording) return;
  if(mediaRecorder && mediaRecorder.state !== 'inactive'){
    mediaRecorder.stop();
  }
}

async function startRecording(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e)=>{ if(e.data && e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = ()=>{
      previewBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      stream.getTracks().forEach(t=>t.stop());
      clearInterval(recordingTimerHandle);
      renderRecorderSheet('preview');
    };
    mediaRecorder.start();
    recordingSeconds = 0;
    renderRecorderSheet('recording');
    recordingTimerHandle = setInterval(()=>{
      recordingSeconds++;
      const el = document.getElementById('recTimer');
      if(el) el.textContent = durFmt(recordingSeconds);
    }, 1000);
  }catch(err){
    renderRecorderSheet('error');
  }
}
function stopRecording(){
  if(mediaRecorder && mediaRecorder.state !== 'inactive'){
    mediaRecorder.stop();
  }
}

function timeLabel(ts){
  const d = new Date(ts);
  const today = new Date(); today.setHours(0,0,0,0);
  const dOnly = new Date(d); dOnly.setHours(0,0,0,0);
  const diffDays = Math.round((today - dOnly)/86400000);
  const hh = d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  if(diffDays===0) return hh;
  if(diffDays===1) return 'אתמול · ' + hh;
  return d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'}) + ' · ' + hh;
}

function renderTasksSection(){
  const open = tasks.filter(t=>!t.done).sort((a,b)=>a.deadline-b.deadline);
  if(open.length===0) return '';
  const now = Date.now();
  return `<div class="taskswrap">${open.map(t=>{
    const msLeft = t.deadline - now;
    const minsLeft = Math.round(msLeft/60000);
    let cls = 'ok';
    if(minsLeft<=0) cls='overdue';
    else if(minsLeft<=30) cls='soon';
    const timeStr = new Date(t.deadline).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
    let label;
    if(minsLeft<=0){
      const daysLate = Math.floor(Math.abs(msLeft)/86400000);
      label = daysLate<=0 ? 'באיחור - עבר היום' : (daysLate===1 ? 'באיחור של יום אחד' : `באיחור של ${daysLate} ימים`);
    } else if(minsLeft<60){
      label = `עוד ${minsLeft} דק'`;
    } else {
      label = `עד השעה ${timeStr}`;
    }
    return `
      <div class="task ${cls}">
        <div class="taskmid">
          <div class="taskttl">${t.title}</div>
          <div class="tasktime">${label} · ${timeStr}</div>

function durFmt(s){
  const mm = String(Math.floor(s/60)).padStart(2,'0');
  const ss = String(s%60).padStart(2,'0');

}

function checkTaskAlerts(){
  if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const now = Date.now();
  tasks.filter(t=>!t.done).forEach(t=>{
    const minsLeft = Math.round((t.deadline - now) / 60000);
    const hourKey = t.id+'-hour', soonKey = t.id+'-soon', overKey = t.id+'-over';
    if(minsLeft <= 60 && minsLeft > 10 && !notifiedTaskAlerts.has(hourKey)){
      notifiedTaskAlerts.add(hourKey);
      try{
        new Notification('⏰ שעה לפני זמן היעד', { body: `${t.title} - עוד כשעה` });
        if(navigator.vibrate) navigator.vibrate([200,100,200]);
      }catch(e){}
    }
    if(minsLeft <= 10 && minsLeft > 0 && !notifiedTaskAlerts.has(soonKey)){
      notifiedTaskAlerts.add(soonKey);
      try{
        new Notification('⏰ מתקרב זמן היעד', { body: `${t.title} - עוד ${minsLeft} דקות` });
        if(navigator.vibrate) navigator.vibrate([200,100,200]);
      }catch(e){}
    }
    if(minsLeft <= 0 && !notifiedTaskAlerts.has(overKey)){
      notifiedTaskAlerts.add(overKey);
      try{
        new Notification('🚨 עבר זמן היעד!', { body: t.title, requireInteraction:true });
        if(navigator.vibrate) navigator.vibrate([300,100,300,100,300]);
      }catch(e){}
    }
  });
}

function dateKey(d){
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function isWorkingOn(d){
  const key = dateKey(d);
  const exc = workExceptions.find(x=>x.date===key);
  if(exc) return exc.working;
  return workDaysPattern[d.getDay()];
}
function totalNetEarnedThisMonth(){
  const now = new Date();
  return entries.filter(e=>{
    const ed = new Date(e.ts);
    return ed.getFullYear()===now.getFullYear() && ed.getMonth()===now.getMonth();
  }).reduce((s,e)=> s + netOf(e), 0);
}
function countRemainingWorkDaysInMonth(){
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const lastDay = new Date(year, month+1, 0).getDate();
  let count = 0;
  for(let day = now.getDate(); day <= lastDay; day++){
    if(isWorkingOn(new Date(year, month, day))) count++;
  }
  return count;
}

}
function debtRemaining(debt){
  return Math.max(0, debt.totalOwed - debtPaidAmount(debt.id));
}
function totalDebtRemaining(){

}

function bankTxKey(t){

}
function isBankTxApproved(t){

function approveAllPendingBankTx(){

function bankRecurringTotal(){
  const seen = {};
  let total = 0;
  // walk transactions newest-first, take the latest APPROVED amount per description tagged 'recurring'
  [...bankTransactions].sort((a,b)=> new Date(b.date) - new Date(a.date)).forEach(t=>{
    const desc = t.description || '';
    const tag = bankTxTags[desc];
    if(tag && tag.type === 'recurring' && tag.installmentsLeft !== 0 && !seen[desc] && isBankTxApproved(t)){
      seen[desc] = true;
      total += Math.abs(Number(t.amount)||0);
    }
  });
  return total;
}
function markBankTxPaid(encodedRawDesc){
  const rawDesc = decodeURIComponent(encodedRawDesc);
  const tag = bankTxTags[rawDesc];
  if(!tag || tag.installmentsLeft == null) return;
  tag.installmentsLeft = Math.max(0, tag.installmentsLeft - 1);
  saveBankTxTags();
  render();
  if(tag.installmentsLeft === 0) celebrateConfetti();
}
function checkBankRecurringPriceIncreases(){
  const ym = currentYm();
  const byDesc = {};
  bankTransactions.forEach(t=>{
    const desc = t.description || '';
    if(!bankTxTags[desc] || bankTxTags[desc].type !== 'recurring') return;
    if(!byDesc[desc]) byDesc[desc] = [];
    byDesc[desc].push(t);
  });
  let changed = false;
  Object.keys(byDesc).forEach(desc=>{
    const sorted = byDesc[desc].sort((a,b)=> new Date(b.date) - new Date(a.date));
    if(sorted.length < 2) return;
    const latest = Math.abs(Number(sorted[0].amount)||0);
    const previous = Math.abs(Number(sorted[1].amount)||0);
    if(latest > previous + 1){
      const alertId = `bankpriceup-${desc}-${sorted[0].date}`;
      if(!tasks.find(t=>t.id===alertId)){
        const displayName = merchantAliases[desc] || desc;
        tasks.push({ id:alertId, title:`⚠️ המחיר של ${displayName} עלה: ${fmt(previous)} → ${fmt(latest)}`, deadline:Date.now(), done:false });
        changed = true;
      }
    }
  });
  if(changed) saveTasks();
}
function findMatchingBankTransaction(amount){
  if(!amount) return null;
  const now = Date.now();
  const cutoff = now - 40*86400000; // only recent transactions count as a live match
  return bankTransactions.find(t=>{
    if(!isBankTxApproved(t)) return false;
    const tTime = new Date(t.date).getTime();
    if(isNaN(tTime) || tTime < cutoff) return false;
    const amtDiff = Math.abs(Math.abs(Number(t.amount)||0) - Number(amount));
    return amtDiff < 2; // close enough to be the same recurring charge
  }) || null;
}

function countWorkDaysInFullMonth(year, month){
  const lastDay = new Date(year, month+1, 0).getDate();
  let count = 0;
  for(let day = 1; day <= lastDay; day++){
    if(isWorkingOn(new Date(year, month, day))) count++;
  }
  return count;
}
function nextOccurrenceDaysAway(dueDay, today, daysInMonth){
  if(dueDay >= today) return dueDay - today;
  return (daysInMonth - today) + dueDay;
}
function findNearestUpcomingCharge(){
  const now = new Date();
  const today = now.getDate();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const candidates = [];
  debts.filter(d=>debtRemaining(d)>0 && d.dueDay && d.monthlyAgreed).forEach(d=>{
    candidates.push({ name:d.creditorName, amount:d.monthlyAgreed, daysAway: nextOccurrenceDaysAway(d.dueDay, today, daysInMonth), icon:'🤝' });
  });
  recurringCharges.filter(r=>r.dueDay && r.installmentsLeft!==0).forEach(r=>{
    candidates.push({ name:r.name, amount:r.amount, daysAway: nextOccurrenceDaysAway(r.dueDay, today, daysInMonth), icon:'📌' });
  });
  if(candidates.length===0) return null;
  candidates.sort((a,b)=>a.daysAway-b.daysAway);
  return candidates[0];
}

const admin = require('firebase-admin');

function requireEnv(name) {
  const v = process.env[name];
  if (!v) {
    console.error(\`Missing required environment variable: \${name}\`);
    process.exit(1);
  }
  return v;
}

async function scrapeIsracard() {
  const options = {
    companyId: CompanyTypes.isracard,
    startDate: new Date(Date.now() - DAYS_BACK * 86400000),
    combineInstallments: false,
    showBrowser: false,
    args: ['--no-sandbox', '--disable-setuid-sandbox'],
  };
  const credentials = {

    password: requireEnv('ISRACARD_PASSWORD'),
    card6Digits: requireEnv('ISRACARD_CARD6DIGITS'),
  };
  const scraper = createScraper(options);
  const result = await scraper.scrape(credentials);
  if (!result.success) {
    console.error('Isracard scrape failed:', result.errorType, result.errorMessage);
    return [];
  }
  const txs = [];
  (result.accounts || []).forEach(acc => {
    (acc.txns || []).forEach(t => {
      txs.push({
        source: 'isracard',
        account: acc.accountNumber,
        date: t.date,
        description: t.description,
        amount: t.chargedAmount != null ? t.chargedAmount : t.originalAmount,
        status: t.status,
      });
    });
  });
  return txs;
}

async function scrapeMax() {

    companyId: CompanyTypes.max,

  });

async function main() {

main().then(() => process.exit(0)).catch(e => {

async function submitAIQuestion(){
  if(aiIsThinking) return;
  const input = document.getElementById('aiQuestionInput');
  const question = (input.value || '').trim();
  if(!question) return;
  input.value = '';
  aiChatHistory.push({ role:'user', text: question });
  aiIsThinking = true;
  render();

  try{
    const context = {
      today: new Date().toLocaleDateString('he-IL'),
      debts: debts.map(d=>({
        שם: d.creditorName, סהכ_חוב: d.totalOwed, נותר: debtRemaining(d),
        תשלום_חודשי_מוסכם: d.monthlyAgreed||null, יום_תשלום_בחודש: d.dueDay||null,
        מכוסה_מהכנסה_נוספת: !!d.coveredByExtraIncome, הערה: d.note||null
      })),
      חיובים_קבועים: recurringCharges.map(r=>({
        שם: r.name, סכום_חודשי: r.amount, יום_חיוב: r.dueDay||null,
        יורד_אוטומטית: !!r.isAutomatic, מכוסה_מהכנסה_נוספת: !!r.coveredByExtraIncome,
        תשלומים_שנותרו: r.installmentsLeft!=null ? r.installmentsLeft : null
      })),
      תנועות_אשראי_אחרונות_מאושרות: bankTransactions.filter(isBankTxApproved).slice(0,150).map(t=>({
        תיאור: merchantAliases[t.description] || t.description,
        מקור: t.source, תאריך: t.date, סכום: t.amount,
        סוג: (bankTxTags[t.description] && bankTxTags[t.description].type) || 'לא סווג',
        הערה: (bankTxTags[t.description] && bankTxTags[t.description].note) || null
      })),
    };
    const systemPrompt = `אתה עוזר פיננסי בתוך אפליקציית ניהול הכנסות והוצאות של נהג בישראל, בשם "המונה שלי". ענה בעברית, בקצרה ובבירור (2-4 משפטים בדרך כלל), אך ורק על סמך הנתונים הבאים בפורמט JSON. אם המידע לא מספיק כדי לענות, תגיד את זה בפירוש ואל תמציא מספרים.\n\nנתונים:\n${JSON.stringify(context)}`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 500,
        system: systemPrompt,
        messages: [{ role: "user", content: question }]
      })
    });
    const data = await response.json();
    const answerText = (data.content || []).map(b => b.text || '').join('\n').trim() || 'לא הצלחתי להבין, נסה לנסח אחרת.';
    aiChatHistory.push({ role:'assistant', text: answerText });
  }catch(e){
    console.error('AI question failed', e);
    aiChatHistory.push({ role:'assistant', text: 'משהו השתבש בשליחת השאלה. נסה שוב בעוד רגע.' });
  }
  aiIsThinking = false;
  render();
}

function renderDebtsScreen(){
  const app = document.getElementById('app');
  const totalRemaining = totalDebtRemaining();
  const totalOwedOriginal = debts.reduce((s,d)=>s+d.totalOwed, 0);
  const totalPaid = totalDebtPaidAllTime();
  const overallPct = totalOwedOriginal>0 ? Math.min(100, Math.round((totalPaid/totalOwedOriginal)*100)) : 0;
  const sorted = [...debts].sort((a,b)=> debtRemaining(b) - debtRemaining(a));
  const sortedRecurring = [...recurringCharges].sort((a,b)=> (a.dueDay||99) - (b.dueDay||99));
  const sortedExtraIncomes = [...extraIncomes].sort((a,b)=> (a.dueDay||99) - (b.dueDay||99));
  const now = new Date();

  // Dynamic catch-up daily target: compares total fixed obligations for the month against what
  // you've actually earned so far this month. If a day falls short, the shortfall automatically
  // raises the required amount for the remaining days - no manual tracking needed.
  const monthlyDebtTarget = debts.filter(d=>debtRemaining(d)>0 && d.monthlyAgreed && !d.coveredByExtraIncome).reduce((s,d)=>s+d.monthlyAgreed, 0);
  const recurringTotal = totalRecurringMonthly();
  const bankRecurring = bankRecurringTotal();
  const combinedMonthlyTotal = monthlyDebtTarget + recurringTotal + bankRecurring;
  const earnedThisMonth = totalNetEarnedThisMonth();
  const stillNeeded = Math.max(0, combinedMonthlyTotal - earnedThisMonth);
  const coveredDebtsTotal = debts.filter(d=>debtRemaining(d)>0 && d.monthlyAgreed && d.coveredByExtraIncome).reduce((s,d)=>s+d.monthlyAgreed, 0);
  const coveredRecurringTotal = recurringCharges.filter(r=>r.installmentsLeft!==0 && r.coveredByExtraIncome).reduce((s,r)=>s+r.amount, 0);
  const coveredTotal = coveredDebtsTotal + coveredRecurringTotal;
  const upcomingObligations = getUpcomingObligations(14);
  const hasConfirmedIncomeThisMonth = extraIncomes.some(i=>extraIncomeStatusFor(i).status==='received');
  const remainingWorkDays = countRemainingWorkDaysInMonth();
  const perWorkDay = remainingWorkDays>0 ? Math.ceil(stillNeeded/remainingWorkDays) : 0;
  const nearestCharge = findNearestUpcomingCharge();
  const todayDate = now.getDate();

  app.innerHTML = `

      <div class="sub">
        <span>שולם עד כה: <b>${fmt(totalPaid)}</b></span>
        <span>מתוך: <b>${fmt(totalOwedOriginal)}</b></span>

    </div>

    ${combinedMonthlyTotal>0 ? `
    <div class="targetcard">
      <div class="targetlabel">💪 כמה עוד צריך להביא היום</div>
      <div class="targetamt"><span>₪</span>${perWorkDay.toLocaleString('he-IL')}</div>

      </div>

function renderDebtChart(){
  const sortedPayments = [...debtPayments].sort((a,b)=>a.ts-b.ts);
  if(sortedPayments.length < 2) return '';
  let cum = 0;
  const points = sortedPayments.map(p=>{ cum += p.amount; return { ts:p.ts, cum }; });
  const maxCum = points[points.length-1].cum || 1;
  const minTs = points[0].ts, maxTs = points[points.length-1].ts || minTs+1;
  const W = 300, H = 90, pad = 8;
  const coords = points.map(p=>{
    const x = pad + (maxTs>minTs ? ((p.ts-minTs)/(maxTs-minTs)) : 0) * (W-2*pad);
    const y = H-pad - (p.cum/maxCum) * (H-2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `
    <div class="goalcard" style="padding:14px 16px;">
      <div class="goallabel" style="margin-bottom:8px;">התקדמות תשלומים לאורך זמן</div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:80px; display:block;">
        <polyline points="${coords}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-top:4px; font-family:'Roboto Mono',monospace;">
        <span>${new Date(minTs).toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'})}</span>
        <span>סה"כ שולם: ${fmt(maxCum)}</span>
        <span>${new Date(maxTs).toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'})}</span>
      </div>
    </div>
  `;
}

function nextDueDateFor(dueDay, hour){
  const now = new Date();
  const today = now.getDate();
  let year = now.getFullYear(), month = now.getMonth();
  if(dueDay < today){
    // this month's occurrence already passed - schedule for next month instead
    month += 1;
    if(month > 11){ month = 0; year += 1; }
  }
  return new Date(year, month, dueDay, hour==null?9:hour, 0, 0);
}
function daysUntilDate(dueDate){
  const now = new Date(); now.setHours(0,0,0,0);
  const d = new Date(dueDate); d.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}
function getUpcomingObligations(daysAhead){
  const list = [];
  debts.filter(d=>debtRemaining(d)>0 && d.monthlyAgreed && d.dueDay).forEach(d=>{
    const dueDate = nextDueDateFor(d.dueDay);
    const daysAway = daysUntilDate(dueDate);
    if(daysAway<=daysAhead){
      const ym = `${dueDate.getFullYear()}-${dueDate.getMonth()+1}`;
      list.push({ type:'debt', id:d.id, name:d.creditorName, amount:d.monthlyAgreed, daysAway, coveredByExtraIncome:!!d.coveredByExtraIncome, prepared: !!(d.preparedMonths && d.preparedMonths[ym]), ym, icon:'🤝' });
    }
  });
  recurringCharges.filter(r=>r.dueDay && r.installmentsLeft!==0).forEach(r=>{
    const dueDate = nextDueDateFor(r.dueDay);
    const daysAway = daysUntilDate(dueDate);
    if(daysAway<=daysAhead){
      const ym = `${dueDate.getFullYear()}-${dueDate.getMonth()+1}`;
      list.push({ type:'recurring', id:r.id, name:r.name, amount:r.amount, daysAway, coveredByExtraIncome:!!r.coveredByExtraIncome, prepared: !!(r.preparedMonths && r.preparedMonths[ym]), ym, icon:'📌' });
    }
  });
  list.sort((a,b)=>a.daysAway-b.daysAway);
  return list;
}
function toggleObligationPrepared(type, id, ym){
  const list = type==='debt' ? debts : recurringCharges;
  const item = list.find(x=>x.id===id);
  if(!item) return;
  item.preparedMonths = item.preparedMonths || {};
  item.preparedMonths[ym] = !item.preparedMonths[ym];
  if(type==='debt') saveDebts(); else saveRecurring();
  render();

function checkMonthlyDebtReminders(){
  // one-time+ongoing cleanup: retire ALL old-format debt reminder tasks (previous versions had
  // a bug where a due-day already passed this month kept generating a "you're late" task instead
  // of rolling forward to next month's occurrence)
  tasks = tasks.filter(t => !(typeof t.id==='string' && t.id.startsWith('debtdue-') && !t.id.endsWith('-dayv3')));
  debts.forEach(debt=>{
    if(!debt.monthlyAgreed || !debt.dueDay) return;
    if(debtRemaining(debt) <= 0) return;
    const dueDate = nextDueDateFor(debt.dueDay);
    const ym = `${dueDate.getFullYear()}-${dueDate.getMonth()+1}`;
    const onDayId = `debtdue-${debt.id}-${ym}-dayv3`;
    if(!tasks.find(t=>t.id===onDayId)){
      tasks.push({ id:onDayId, title:`💰 תשלום ל${debt.creditorName} · ${fmt(debt.monthlyAgreed)} · יום ${debt.dueDay} לחודש`, deadline:dueDate.getTime(), done:false });
    }
  });
  saveTasks();
}

    <button class="taskbtn" onclick="openTaskModal()"><span>⏰</span><span>הוספת תזכורת עם שעה</span></button>
    ${(typeof Notification!=='undefined' && Notification.permission==='default' && tasks.some(t=>!t.done)) ? `
    <button class="taskbtn" onclick="requestNotifyPermission()" style="border-color:var(--accent); color:var(--accent);"><span>🔔</span><span>הפעלת התראות לתזכורות</span></button>
    ` : ''}
    ${renderVoiceSection()}

    <div class="meter">
      <div class="label">${period!=='today' ? (period==='week'?'רווח נטו · השבוע':period==='month'?'רווח נטו · החודש':'רווח נטו · הכל') : (viewingWorkdayId ? 'רווח נטו · יום נבחר' : 'רווח נטו · יום עבודה נוכחי')}</div>
      <div class="amount"><span>₪</span>${netTotal.toLocaleString('he-IL',{minimumFractionDigits:0, maximumFractionDigits:0})}</div>
      <div class="sub">
        <span>נסיעות: <b>${list.filter(e=>!isExpenseKind(e.kind)).length}</b></span>
        <span>דלק: <b>${fmt(list.filter(e=>e.kind==='fuel').reduce((s,e)=>s+e.amount,0))}</b></span>
        <span>אוכל: <b>${fmt(list.filter(e=>e.kind==='food').reduce((s,e)=>s+e.amount,0))}</b></span>
      </div>
    </div>

    ${period==='today' ? renderGoalCard(netTotal) : ''}
    ${renderDebtEntryPoint()}
    <div class="workdaybar" style="cursor:pointer;" onclick="openAIScreen()">
      <span>🤖 שאל את המונה שלי</span>
      <span class="wdbtn">שאלה</span>
    </div>
    <div class="workdaybar" style="cursor:pointer;" onclick="openBankSetupScreen()">
      <span>🏦 חיבור אוטומטי לישראכרט/מקס</span>
      <span class="wdbtn">מדריך</span>
    </div>

    <div class="outstanding ${outstanding>0?'':'hidden'}">
      <span>💸 מגיע לך מלקוחות שטרם שילמו</span>
      <b>${fmt(outstanding)}</b>
    </div>

    <div class="alertbar charge ${pendingCharges.length>0?'':'hidden'}">
      <span>⚠️ ${pendingCharges.length} נסיעות בוטלו - לא בטוח שהניכוי בוטל</span>
      <b>עד ${fmt(pendingChargeSum)}</b>
    </div>

    <div class="actions">
      <button class="actbtn passenger" onclick="openDraft('passenger')">
        <span class="ic">🚕</span> נסיעה
      </button>
      <button class="actbtn delivery" onclick="openDraft('delivery')">
        <span class="ic">📦</span> משלוח
      </button>
      ${isOwnerAccount() ? `
      <button class="actbtn install" onclick="openDraft('install')">
        <span class="ic">🔧</span> התקנה
      </button>` : ''}
    </div>
    <div class="expenserow">
      <button class="fuelbtn" onclick="openDraft('fuel')"><span>⛽</span><span>דלק</span></button>
      <button class="fuelbtn" onclick="openDraft('food')"><span>🍔</span><span>אוכל</span></button>
    </div>

    <div class="tabs">
      ${['today','week','month','all'].map(p=>`
        <div class="tab ${period===p?'active':''}" onclick="setPeriod('${p}')">
          ${p==='today'?'היום':p==='week'?'השבוע':p==='month'?'החודש':'הכל'}
        </div>`).join('')}
    </div>

    <div class="listwrap">
      ${list.length===0 ? `
        <div class="empty">
          <span class="ic">🧾</span>
          עדיין אין רשומות בטווח הזה.<br>תתחיל בלחיצה על נסיעה או משלוח למעלה.
        </div>` : list.map(e=>`
        <div class="entry">
          <div class="ic">${CATS[e.kind].ic}</div>
          <div class="mid">
            <div class="ttl" style="${e.status==='cancelled'?'text-decoration:line-through; color:var(--muted);':''}">${CATS[e.kind].label}${e.urgency==='special' ? ' · ⚡ ספיישל' : ''}${e.urgency==='relaxed' ? ' · 🕊️ נחת' : ''}${!isExpenseKind(e.kind) && e.commissionPct>0 ? ' · '+e.commissionPct+'%' : ''}${e.status==='cancelled' ? ' · בוטלה' : ''}</div>
            <div class="meta">
              <span>${timeLabel(e.ts)}</span>
            </div>
            ${(e.name || e.phone) ? `
            <div class="contactline">
              ${e.name ? `<span>👤 ${e.name}</span>` : ''}
              ${e.phone ? `<a href="tel:${e.phone.replace(/[^0-9+]/g,'')}">📞 ${e.phone}</a>` : ''}
            </div>` : ''}
          </div>
          ${badgeFor(e)}
          <div class="amt" onclick="openAmountEdit('${e.id}')" style="color:${isExpenseKind(e.kind)?'var(--unpaid)':(e.status==='cancelled' && !(e.commissionPct>0 && e.chargeStatus==='charged') ? 'var(--muted)':'var(--text)')}">${fmt(e.amount)}</div>
          <div class="rowactions">
            ${!isExpenseKind(e.kind) ? `<span class="editdebtor" onclick="openDebtorEdit('${e.id}')">✏️</span>` : ''}
            <div class="del" onclick="removeEntry('${e.id}')">✕</div>
          </div>
        </div>
      `).join('')}
    </div>

    ${entries.length>0 ? `<div class="resetlink" onclick="resetAllData()">🗑️ איפוס כל הנתונים</div>` : ''}
    ${currentUid ? `
      <div class="useremail">מחובר כ-${currentUserEmail}</div>
      <div class="useremail" style="font-family:'Roboto Mono',monospace; font-size:10px; opacity:.7; margin-top:4px; user-select:all; cursor:text;" title="לחץ לבחירה והעתקה">UID: ${currentUid}</div>
      <div class="logoutlink" onclick="signOutUser()">🚪 התנתקות</div>
    ` : ''}

    <button class="fab" id="fabRec"
      onpointerdown="fabStart(event)" onpointerup="fabStop(event)"
      onpointerleave="fabStop(event)" onpointercancel="fabStop(event)"
      oncontextmenu="return false">🎙️</button>
    <div class="rectoast" id="recToast"></div>
  `;
}

function setPeriod(p){ period = p; viewingWorkdayId = null; render(); }

// ---- Draft / modal (quick add) ----
function openDraft(kind){
  if(kind==='install' && !isOwnerAccount()) return;
  draft = { kind, digits:'', commissionPct: (isExpenseKind(kind)||kind==='install') ? 0 : (lastCommissionPct[kind] ?? 0), contactOpen:false, forcedContact:false, name:'', phone:'', urgency:null, deadlineTime:'' };
  renderSheet();
  document.getElementById('overlay').classList.add('open');
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('open');
  draft = null;
  editTargetId = null;
  if(mediaRecorder && mediaRecorder.state !== 'inactive'){
    try{ mediaRecorder.stop(); }catch(e){}
  }
  clearInterval(recordingTimerHandle);
  previewBlob = null;
}
function pressKey(k){
  if(!draft) return;
  if(k==='back'){ draft.digits = draft.digits.slice(0,-1); }
  else if(k==='.'){ if(!draft.digits.includes('.')) draft.digits += (draft.digits===''?'0.':'.'); }
  else { if(draft.digits.length < 7) draft.digits += k; }
  renderSheet();
}
function toggleContact(){
  if(!draft) return;
  draft.contactOpen = !draft.contactOpen;
  renderSheet();
}
function setUrgency(val){
  if(!draft) return;
  draft.urgency = (draft.urgency===val) ? null : val;
  if(draft.urgency==='relaxed' && !draft.deadlineTime){
    const now = new Date();
    now.setMinutes(now.getMinutes()+30);
    draft.deadlineTime = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  }
  if(draft.urgency!=='relaxed') draft.deadlineTime = '';
  renderSheet();
}
function setCommission(pct){
  if(!draft) return;
  draft.commissionPct = pct;
  renderSheet();
}
function setCustomCommission(val){
  if(!draft) return;
  draft.commissionPct = val === '' ? 0 : Math.max(0, Math.min(100, parseFloat(val)||0));
  document.querySelectorAll('.qchip').forEach(el=>el.classList.remove('on'));
}
function commitDraft(status){
  if(!draft) return;
  const amount = parseFloat(draft.digits || '0');
  if(!amount || amount<=0){ return; }

  if(status==='unpaid' && !isExpenseKind(draft.kind) && !draft.forcedContact){
    draft.forcedContact = true;
    draft.contactOpen = true;
    renderSheet();
    return;
  }

  if(!isExpenseKind(draft.kind)) lastCommissionPct[draft.kind] = draft.commissionPct;
  addEntry({
    id: 'e'+Date.now()+Math.random().toString(36).slice(2,7),
    kind: draft.kind,
    amount,
    commissionPct: isExpenseKind(draft.kind) ? 0 : (draft.commissionPct||0),
    status: isExpenseKind(draft.kind) ? 'paid' : status,
    chargeStatus: status==='cancelled' ? 'pending' : null,
    name: isExpenseKind(draft.kind) ? '' : (draft.name || '').trim(),
    phone: isExpenseKind(draft.kind) ? '' : (draft.phone || '').trim(),
    urgency: isExpenseKind(draft.kind) ? null : draft.urgency,
    ts: currentTs()
  });

  if(!isExpenseKind(draft.kind) && draft.urgency==='relaxed' && draft.deadlineTime){
    const [h,m] = draft.deadlineTime.split(':').map(Number);
    const d = new Date();
    d.setHours(h, m, 0, 0);
    const nameTag = (draft.name || '').trim();
    tasks.push({
      id: 'task'+Date.now()+Math.random().toString(36).slice(2,7),
      title: `${CATS[draft.kind].label}${nameTag ? ' - '+nameTag : ''} · ₪${amount}`,
      deadline: d.getTime(),
      done:false
    });
    saveTasks();
  }

  closeSheet();
}

function renderSheet(){
  if(!draft) return;
  const cat = CATS[draft.kind];
  const amountVal = draft.digits || '0';
  const sheet = document.getElementById('sheet');

  if(draft.forcedContact){
    sheet.innerHTML = `
      <h2>👤 למי מחכים לתשלום?</h2>
      <div class="display"><div class="val mono">₪${amountVal}</div></div>
      <input id="draftName" class="contactinput" style="width:100%; margin-bottom:8px;" type="text" placeholder="שם הלקוח (לא חובה)" value="${draft.name||''}" oninput="draft.name=this.value">
      <input id="draftPhone" class="contactinput" style="width:100%; margin-bottom:8px;" type="tel" placeholder="טלפון (לא חובה)" value="${draft.phone||''}" oninput="draft.phone=this.value">
      <div class="expenserow" style="margin:0;">
          <div class="contacttoggle" style="flex:1;" onclick="pickContactInto('draftName','draftPhone')">📇 אנשי קשר</div>
          <div class="contacttoggle" style="flex:1;" onclick="openWhatsAppApp()">📱 WhatsApp</div>
        </div>
      <div class="saverow">
        <button class="savebtn single" onclick="commitDraft('unpaid')">💾 שמירה</button>
      </div>
      <div class="cancel" onclick="draft.name='';draft.phone='';commitDraft('unpaid')">דלג בלי פרטים</div>
    `;
    return;
  }

  sheet.innerHTML = `
    <h2>${cat.ic} הוספת ${cat.label}</h2>
    <div class="display"><div class="val mono">₪${amountVal}</div></div>
    ${!isExpenseKind(draft.kind) ? `
      ${draft.kind!=='install' ? `
      <div class="commlabel">אחוז ניכוי מהנסיעה</div>
      <div class="commquick">
        <div class="qchip ${draft.commissionPct===0?'on':''}" onclick="setCommission(0)">אין ניכוי</div>
        <div class="qchip ${draft.commissionPct===12?'on':''}" onclick="setCommission(12)">12%</div>
        <input class="comminput" type="number" min="0" max="100" inputmode="decimal" placeholder="אחר %" value="${(draft.commissionPct!==0 && draft.commissionPct!==12) ? draft.commissionPct : ''}" oninput="setCustomCommission(this.value)">
      </div>` : ''}
      ${!draft.contactOpen ? `
        <div class="contacttoggle" onclick="toggleContact()">➕ הוספת שם וטלפון של הלקוח (לגביה)</div>
      ` : `
        <div class="contactfields">
          <input id="draftName" class="contactinput" type="text" placeholder="שם הלקוח" value="${draft.name||''}" oninput="draft.name=this.value">
          <input id="draftPhone" class="contactinput" type="tel" placeholder="טלפון" value="${draft.phone||''}" oninput="draft.phone=this.value">
        </div>
        <div class="expenserow" style="margin:0;">
          <div class="contacttoggle" style="flex:1;" onclick="pickContactInto('draftName','draftPhone')">📇 אנשי קשר</div>
          <div class="contacttoggle" style="flex:1;" onclick="openWhatsAppApp()">📱 WhatsApp</div>
        </div>
      `}
      <div class="commlabel" style="margin-top:14px;">סוג המשלוח / נסיעה</div>
      <div class="commquick">
        <div class="qchip ${draft.urgency==='special'?'on':''}" onclick="setUrgency('special')">⚡ ספיישל (מיידי)</div>
        <div class="qchip ${draft.urgency==='relaxed'?'on':''}" onclick="setUrgency('relaxed')">🕊️ נחת (רגוע)</div>
      </div>
      ${draft.urgency==='relaxed' ? `
        <div class="deadlinerow">
          <input class="timepicker" type="time" value="${draft.deadlineTime||''}" oninput="draft.deadlineTime=this.value">
          <button class="timeresetbtn" onclick="const n=new Date(); n.setMinutes(n.getMinutes()+30); draft.deadlineTime=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); renderSheet();">🔄</button>
        </div>
        <div style="font-size:11px; color:var(--muted); margin:0 0 12px;">עד איזו שעה צריך למסור (לא חובה)</div>
      ` : ''}` : ''}
    <div class="keypad">
      ${['1','2','3','4','5','6','7','8','9','.','0','back'].map(k=>`
        <button class="key ${k==='back'?'fn':''}" onclick="pressKey('${k}')">${k==='back'?'⌫':k}</button>
      `).join('')}
    </div>
    ${isExpenseKind(draft.kind) ? `
      <div class="saverow">
        <button class="savebtn single" onclick="commitDraft('paid')"><span>💾</span><span>שמירה</span></button>
      </div>` : `
      <div class="saverow">
        <button class="savebtn paid" onclick="commitDraft('paid')">✓<br>שולם</button>
        <button class="savebtn unpaid" onclick="commitDraft('unpaid')">⏳<br>טרם שולם</button>
        <button class="savebtn cancelbtn" onclick="commitDraft('cancelled')">🚫<br>בוטלה</button>
      </div>`}
    <div class="cancel" onclick="closeSheet()">ביטול</div>
  `;
}

setInterval(()=>{
  if(firebaseReady && !currentUid) return; // not logged in, login screen is showing - don't touch it
  const overlayOpen = document.getElementById('overlay').classList.contains('open');
  const anyAudioPlaying = Array.from(document.querySelectorAll('audio')).some(a=>!a.paused);
  if(!overlayOpen && !anyAudioPlaying && !fabRecording) render();
}, 60000);

setInterval(()=>{
  if(firebaseReady && !currentUid) return;
  checkTaskAlerts();
}, 20000);
</script>
</body>
</html>
